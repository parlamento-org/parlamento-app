version: "3.9" # optional since v1.27.0
services:
  dev-parlamento-fe:
    stdin_open: true # Allow hot reload
    tty: true
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
  test-parlamento-fe:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile.test
    volumes:
      - ./frontend/lib:/usr/src/app/lib
      - ./frontend/test:/usr/src/app/test
  prod-parlamento-fe:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile.prod
    ports:
      - "80:80"
  postgres-parlamento:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PARLAMENTO_DB_NAME:-parlamento}
      POSTGRES_USER: ${PARLAMENTO_DB_USER:-parlamento}
      POSTGRES_PASSWORD: ${PARLAMENTO_DB_PASSWORD:-parlamento}
    ports:
      - "5432:5432"
    volumes:
      - parlamento-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PARLAMENTO_DB_USER:-parlamento} -d ${PARLAMENTO_DB_NAME:-parlamento}"]
      interval: 10s
      timeout: 5s
      retries: 10
  dev-parlamento-be:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - "8180:8080"
      - "8181:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres-parlamento;Port=5432;Database=${PARLAMENTO_DB_NAME:-parlamento};Username=${PARLAMENTO_DB_USER:-parlamento};Password=${PARLAMENTO_DB_PASSWORD:-parlamento}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini-2024-07-18}
      ParliamentOpenData__LatestLegislature: ${PARLIAMENT_OPEN_DATA_LATEST_LEGISLATURE:-XVII}
      ParliamentOpenData__DailyImport__Enabled: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_ENABLED:-false}
      ParliamentOpenData__DailyImport__RunSummaries: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_RUN_SUMMARIES:-true}
      ParliamentOpenData__DailyImport__TimeZoneId: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_TIME_ZONE_ID:-Europe/Lisbon}
      ParliamentOpenData__DailyImport__RunAt: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_RUN_AT:-00:00:00}
      ParliamentOpenData__Legislatures__XV__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XV_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XV__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XV_BASE_INFO_URL}
      ParliamentOpenData__Legislatures__XVI__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XVI_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XVI__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XVI_BASE_INFO_URL}
      ParliamentOpenData__Legislatures__XVII__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XVII_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XVII__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XVII_BASE_INFO_URL}
    volumes:
      - ./backend/src:/usr/src/app/src
      - ./backend/Domain:/usr/src/app/Domain
      - ./backend/Application:/usr/src/app/Application
      - ./backend/Infrastructure:/usr/src/app/Infrastructure
    depends_on:
      postgres-parlamento:
        condition: service_healthy
      db-parlamento-migrate:
        condition: service_completed_successfully
  prod-parlamento-be:
    build:
      context: ./backend
      dockerfile: ./Dockerfile.prod
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=postgres-parlamento;Port=5432;Database=${PARLAMENTO_DB_NAME:-parlamento};Username=${PARLAMENTO_DB_USER:-parlamento};Password=${PARLAMENTO_DB_PASSWORD:-parlamento}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini-2024-07-18}
      ParliamentOpenData__LatestLegislature: ${PARLIAMENT_OPEN_DATA_LATEST_LEGISLATURE:-XVII}
      ParliamentOpenData__DailyImport__Enabled: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_ENABLED:-false}
      ParliamentOpenData__DailyImport__RunSummaries: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_RUN_SUMMARIES:-true}
      ParliamentOpenData__DailyImport__TimeZoneId: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_TIME_ZONE_ID:-Europe/Lisbon}
      ParliamentOpenData__DailyImport__RunAt: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_RUN_AT:-00:00:00}
      ParliamentOpenData__Legislatures__XV__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XV_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XV__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XV_BASE_INFO_URL}
      ParliamentOpenData__Legislatures__XVI__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XVI_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XVI__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XVI_BASE_INFO_URL}
      ParliamentOpenData__Legislatures__XVII__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XVII_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XVII__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XVII_BASE_INFO_URL}
    depends_on:
      postgres-parlamento:
        condition: service_healthy
      db-parlamento-migrate:
        condition: service_completed_successfully
  test-parlamento-be:
    build:
      context: ./backend
      dockerfile: ./Dockerfile.test
    environment:
      ASPNETCORE_ENVIRONMENT: Test
      ConnectionStrings__DefaultConnection: Host=postgres-parlamento;Port=5432;Database=${PARLAMENTO_DB_NAME:-parlamento};Username=${PARLAMENTO_DB_USER:-parlamento};Password=${PARLAMENTO_DB_PASSWORD:-parlamento}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini-2024-07-18}
      ParliamentOpenData__LatestLegislature: ${PARLIAMENT_OPEN_DATA_LATEST_LEGISLATURE:-XVII}
      ParliamentOpenData__DailyImport__Enabled: false
      ParliamentOpenData__DailyImport__RunSummaries: false
      ParliamentOpenData__DailyImport__TimeZoneId: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_TIME_ZONE_ID:-Europe/Lisbon}
      ParliamentOpenData__DailyImport__RunAt: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_RUN_AT:-00:00:00}
      ParliamentOpenData__Legislatures__XV__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XV_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XV__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XV_BASE_INFO_URL}
      ParliamentOpenData__Legislatures__XVI__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XVI_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XVI__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XVI_BASE_INFO_URL}
      ParliamentOpenData__Legislatures__XVII__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XVII_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XVII__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XVII_BASE_INFO_URL}
    volumes:
      - ./backend/src:/usr/src/app/src
      - ./backend/test:/usr/src/app/test
      - ./backend/integration-tests:/usr/src/app/integration-tests
      - ./backend/Domain:/usr/src/app/Domain
      - ./backend/Application:/usr/src/app/Application
      - ./backend/Infrastructure:/usr/src/app/Infrastructure
    depends_on:
      postgres-parlamento:
        condition: service_healthy
      db-parlamento-migrate:
        condition: service_completed_successfully
  db-parlamento-migrate:
    build:
      context: ./backend
      dockerfile: ./Dockerfile.migrate
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres-parlamento;Port=5432;Database=${PARLAMENTO_DB_NAME:-parlamento};Username=${PARLAMENTO_DB_USER:-parlamento};Password=${PARLAMENTO_DB_PASSWORD:-parlamento}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini-2024-07-18}
      ParliamentOpenData__LatestLegislature: ${PARLIAMENT_OPEN_DATA_LATEST_LEGISLATURE:-XVII}
      ParliamentOpenData__DailyImport__Enabled: false
      ParliamentOpenData__DailyImport__RunSummaries: false
      ParliamentOpenData__DailyImport__TimeZoneId: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_TIME_ZONE_ID:-Europe/Lisbon}
      ParliamentOpenData__DailyImport__RunAt: ${PARLIAMENT_OPEN_DATA_DAILY_IMPORT_RUN_AT:-00:00:00}
      ParliamentOpenData__Legislatures__XV__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XV_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XV__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XV_BASE_INFO_URL}
      ParliamentOpenData__Legislatures__XVI__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XVI_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XVI__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XVI_BASE_INFO_URL}
      ParliamentOpenData__Legislatures__XVII__InitiativesUrl: ${PARLIAMENT_OPEN_DATA_XVII_INITIATIVES_URL}
      ParliamentOpenData__Legislatures__XVII__BaseInfoUrl: ${PARLIAMENT_OPEN_DATA_XVII_BASE_INFO_URL}
    depends_on:
      postgres-parlamento:
        condition: service_healthy

volumes:
  parlamento-postgres-data:
