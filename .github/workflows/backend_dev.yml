name: Deploy Backend Development

on:
  push:
    branches:
      - development
    paths:
      - "backend/**"
      - ".github/workflows/backend_dev.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: parlamento_test
          POSTGRES_USER: parlamento
          POSTGRES_PASSWORD: parlamento
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parlamento -d parlamento_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        working-directory: ./backend
        run: dotnet restore

      - name: Build
        working-directory: ./backend
        run: dotnet build --configuration Release --no-restore

      - name: Test
        working-directory: ./backend
        env:
          ASPNETCORE_ENVIRONMENT: Test
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=parlamento_test;Username=parlamento;Password=parlamento
        run: dotnet test --configuration Release --no-build

  migrate:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        working-directory: ./backend
        run: dotnet restore

      - name: Apply EF migrations to Neon
        working-directory: ./backend
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.NEON_CONNECTION_STRING }}
          ASPNETCORE_ENVIRONMENT: Production
        run: |
          dotnet ef database update \
            --project Infrastructure \
            --startup-project src

  deploy:
    runs-on: ubuntu-latest
    needs: migrate

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy backend to Fly
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cp fly.dev.toml fly.toml
          flyctl deploy --remote-only
